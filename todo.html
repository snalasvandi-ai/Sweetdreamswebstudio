<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیست کارهای روزمره | To-Do List</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* استایل منو */
        .navbar {
            background-color: #1d3557;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            direction: ltr; /* منو چپ به راست نمایش داده شود */
        }

        .navbar .logo { color: white; font-size: 20px; font-weight: bold; }
        .navbar ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 20px; }
        .navbar a { color: #f1faee; text-decoration: none; font-size: 15px; }
        .navbar a:hover { color: #e76f51; }

        /* بدنه و کارت اصلی */
        .container {
            display: flex;
            justify-content: center;
            padding: 30px 20px;
            flex: 1;
        }

        .todo-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-top: 5px solid #2a9d8f;
            height: fit-content;
        }

        h2 {
            color: #1d3557;
            margin-top: 0;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button.add-btn {
            background-color: #2a9d8f;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button.add-btn:hover { background-color: #218376; }

        /* لیست کارها */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 3px solid #1d3557;
        }

        .delete-btn {
            background-color: #e76f51;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover { background-color: #d64421; }

        footer {
            background-color: #1d3557;
            color: #f1faee;
            text-align: center;
            padding: 15px 10px;
            font-size: 14px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- منوی بالای سایت -->
    <!-- منوی یکدست و سالم برای تمامی صفحات -->
    <nav class="navbar">
        <div class="logo">My Portfolio</div>
        <ul>
            <li><a href="index.html">خانه / Home</a></li>
            <li><a href="about.html">درباره ما / About</a></li>
            <li><a href="contact.html">تماس / Contact</a></li>
            <li><a href="todo.html">لیست کارها / To-Do</a></li>
            <li><a href="calculator.html">ماشین حساب / Calc</a></li>
            <li><a href="converter.html">مبدل واحد / Convert</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="todo-card">
            <h2>لیست کارهای من</h2>
            
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="کار جدید را بنویسید...">
                <button class="add-btn" onclick="addTask()">افزودن</button>
            </div>

            <ul id="taskList">
                <!-- کارهای جدید با جاوااسکریپت اینجا اضافه می‌شوند -->
            </ul>
        </div>
    </div>

    <footer>
        <p>© 2026 My Multilingual Website. All rights reserved.</p>
    </footer>

    <script>
        function addTask() {
            let input = document.getElementById('taskInput');
            let taskText = input.value.trim();

            if (taskText === "") {
                alert("لطفاً ابتدا یک کار بنویسید!");
                return;
            }

            let li = document.createElement('li');
            li.innerHTML = `
                <span>${taskText}</span>
                <button class="delete-btn" onclick="deleteTask(this)">حذف</button>
            `;

            document.getElementById('taskList').appendChild(li);
            input.value = "";
        }

        function deleteTask(button) {
            button.parentElement.remove();
        }
    </script>

</body>
</html>
