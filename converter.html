<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مبدل واحدها | Unit Converter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* استایل منوی بالای صفحه */
        .navbar {
            background-color: #1d3557;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            direction: ltr;
        }

        .navbar .logo { color: white; font-size: 20px; font-weight: bold; }
        .navbar ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 12px; }
        .navbar a { color: #f1faee; text-decoration: none; font-size: 14px; }
        .navbar a:hover { color: #e76f51; }

        .container {
            display: flex;
            justify-content: center;
            padding: 30px 20px;
            flex: 1;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-top: 5px solid #2a9d8f;
            height: fit-content;
        }

        h2 { color: #1d3557; margin-top: 0; text-align: center; }

        .form-group { margin-bottom: 15px; }

        label { display: block; margin-bottom: 5px; font-weight: bold; color: #1d3557; }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background-color: #2a9d8f;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover { background-color: #218376; }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 6px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #1d3557;
            display: none;
        }

        footer {
            background-color: #1d3557;
            color: #f1faee;
            text-align: center;
            padding: 15px 10px;
            font-size: 14px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- منوی یکدست ۶ گزینه‌ای -->
    <nav class="navbar">
        <div class="logo">My Portfolio</div>
        <ul>
            <li><a href="index.html">خانه / Home</a></li>
            <li><a href="about.html">درباره ما / About</a></li>
            <li><a href="contact.html">تماس / Contact</a></li>
            <li><a href="todo.html">لیست کارها / To-Do</a></li>
            <li><a href="calculator.html">ماشین حساب / Calc</a></li>
            <li><a href="converter.html">مبدل واحد / Convert</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card">
            <h2>مبدل هوشمند واحدها</h2>
            
            <div class="form-group">
                <label>مقدار ورودی:</label>
                <input type="number" id="inputValue" placeholder="عدد را وارد کنید...">
            </div>

            <div class="form-group">
                <label>نوع تبدیل:</label>
                <select id="conversionType">
                    <option value="kmToMiles">کیلومتر به مایل (km ➔ miles)</option>
                    <option value="milesToKm">مایل به کیلومتر (miles ➔ km)</option>
                    <option value="cToF">سانتی‌گراد به فارنهایت (°C ➔ °F)</option>
                    <option value="fToC">فارنهایت به سانتی‌گراد (°F ➔ °C)</option>
                </select>
            </div>

            <button onclick="convert()">محاسبه و تبدیل</button>

            <div id="result" class="result-box"></div>
        </div>
    </div>

    <footer>
        <p>© 2026 My Multilingual Website. All rights reserved.</p>
    </footer>

    <script>
        function convert() {
            let val = parseFloat(document.getElementById('inputValue').value);
            let type = document.getElementById('conversionType').value;
            let resultBox = document.getElementById('result');

            if (isNaN(val)) {
                resultBox.style.display = 'block';
                resultBox.style.color = '#d8000c';
                resultBox.innerText = 'لطفاً یک عدد معتبر وارد کنید!';
                return;
            }

            let result = 0;
            let text = '';

            if (type === 'kmToMiles') {
                result = val * 0.621371;
                text = `${val} کیلومتر = ${result.toFixed(2)} مایل`;
            } else if (type === 'milesToKm') {
                result = val / 0.621371;
                text = `${val} مایل = ${result.toFixed(2)} کیلومتر`;
            } else if (type === 'cToF') {
                result = (val * 9/5) + 32;
                text = `${val}°C = ${result.toFixed(2)}°F`;
            } else if (type === 'fToC') {
                result = (val - 32) * 5/9;
                text = `${val}°F = ${result.toFixed(2)}°C`;
            }

            resultBox.style.display = 'block';
            resultBox.style.color = '#1d3557';
            resultBox.innerText = text;
        }
    </script>

</body>
</html>
